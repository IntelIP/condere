[project]
name = "condere"
version = "0.1.0"
description = "Evidence-backed commercialization assessments on self-hosted Deep Agents infrastructure"
requires-python = ">=3.12,<3.14"
dependencies = [
  "deepagents==0.7.29",
  "smolmachines==1.31.0",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.35,<1",
  "langchain-openai>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "boto3>=1.40,<2",
  "mcp>=1.20,<2",
  "pydantic>=2,<3",
  "langsmith==0.14.12",
  "modal==1.6.3",
]

[dependency-groups]
dev = [
    "openevals==0.2.2",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/condere"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: starts explicitly enabled local infrastructure"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
