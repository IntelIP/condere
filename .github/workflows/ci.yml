name: Public repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.7"
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check src scripts tests
      - run: uv run pytest tests -q --junitxml=.artifacts/validation/tests.xml
      - run: uv run python scripts/check_public_tree.py
      - run: bash scripts/check-dead-code.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.6"
          cache: false
      - run: go install github.com/gitleaks/gitleaks/v8@v8.30.1
      - run: gitleaks git . --log-opts="--all --full-history --root" --redact=100 --no-banner
      - name: Record the tested commit
        if: always()
        run: |
          mkdir -p .artifacts/validation
          git rev-parse HEAD > .artifacts/validation/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/validation/
          if-no-files-found: error
          retention-days: 14
